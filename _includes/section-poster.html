{%- assign s = include.section -%}
<section id="poster">
  {% if s.eyebrow %}<div class="section-eyebrow">{{ s.eyebrow }}</div>{% endif %}
  <div style="display:flex; flex-direction:column; gap:40px;">
    {% for item in s.items %}
      {%- if item.size == "small_center" -%}
        <p style="margin:0; font-size:16px; font-weight:700; color:#03C75A; text-align:center;">{{ item.text }}</p>
      {%- elsif item.size == "large" -%}
        <p style="margin:0; font-size:clamp(28px,4vw,40px); font-weight:900; color:#03C75A; line-height:1.3;">{{ item.text }}</p>
      {%- else -%}
        <p style="margin:0; font-size:clamp(22px,3vw,28px); font-weight:800; color:#03C75A; line-height:1.3;">{{ item.text }}</p>
      {%- endif -%}
    {% endfor %}
  </div>
</section>
