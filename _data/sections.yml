sections:
  - type: hero
    eyebrow: 네이버 비즈니스 스쿨
    title_line1: 내 비즈니스의 진짜 성장을 만나는
    title_emphasis: 네이버 비즈니스 스쿨
    body_html: 네이버 비즈니스 스쿨 속 강의들은, <strong class="green">네이버를 직접 만드는 사람들이 만든 커리큘럼</strong>을 따릅니다. 내가 어느 단계에 있는지 알고, 그 다음을 볼 수 있게 설계되어 <strong class="green">260만 수강생</strong>이 같은 자리에서 고민을 풀고 다음 단계로 향했습니다.<br><br>전국 네이버 스퀘어에서는 배운 것을 바로 실습해 볼 수 있고, 같은 고민을 먼저 해결한 사람을 만납니다. <strong class="green">방문자 10 명중 7명</strong>은 네이버 스퀘어를 다시 찾아 진짜 성장을 이어 나갔습니다.<br><br><span style="display:inline-block; font-size:24px; font-weight:900; color:#03C75A; margin:8px 0;">내 성장이, 더 큰 성장의 일부가 됩니다</span><br>사업자와 창작자 각자의 고민이 풀릴 때마다, 그 성장은 혼자의 것으로 끝나지 않습니다. 모든 성장이 모여, 더 큰 임팩트가 됩니다.
    ctas:
      - label: 네이버 비즈니스 스쿨
        target: '#strengths'
      - label: 네이버 스퀘어
        target: '#square'
    divider_after: true
  - type: stories
    eyebrow: 성장 사례
    title_line1: 네이버 생태계 곳곳에서
    divider_after: true
    title_line2: 진짜 성장을 마주한 경험들
    title_emphasis_target: line2_first_word
    body: "혼자서는 오래 걸릴 고민도, \v네이버 생태계 속 진짜 현실을 먼저 경험한 <strong class=\"green\">진짜 성장 이야기</strong>들을 만난다면\v내 비즈니스를 더 깊이 이해할 수 있습니다."
    cards:
      - category: 스마트스토어
        icon_emoji: 🛍️
        icon_color: store
        quote: 50대 중반에 시작한 사업, 망했다가 네비스 덕분에 살았습니다.
        stat_label: 네비스 수강 15회, 스퀘어 이용 10회
        stat_value: +40억
        stat_suffix: 4년 만에
      - category: 광고
        icon_emoji: 📣
        icon_color: ad
        quote: 막연하던 광고 원리를 제대로 짚어주니, 같은 광고비로 손님은 2.3배 늘었어요.
        stat_label: 사이트검색광고 오프라인 수강생 평균 주문 건수
        stat_value: +2.3배
        stat_suffix: 매출 성장
      - category: 스마트플레이스
        icon_emoji: 🛍️
        icon_color: store
        quote: 취합중
        stat_label: 취합중
        stat_value: 취합중
        stat_suffix: 취합중
  - type: strengths
    eyebrow: 네비스 강점
    title_line1: 나의 비즈니스 고민 해결,
    title_emphasis: 믿을 수 있는 정답
    divider_after: false
    title_line2: 온라인 교육에서는
    title_line2_suffix: 을
    cards:
      - card_style: chips
        chips:
          - label: 스마트스토어
            emoji: 🛍️
            color: store
          - label: 광고
            emoji: 📣
            color: ad
          - label: 스마트플레이스
            emoji: 📍
            color: place
          - label: 콘텐츠
            emoji: ✍️
            color: blog
        headline: 네이버 비즈니스 성장을 위한 다양한 교육.
        headline_emphasis: 여기서 한 번에.
        cta_label: 전체 강의 둘러보기
        cta_url: https://bizschool.naver.com/
      - card_style: live
        headline: 빠르게 변화하는 네이버 서비스를. 가장 빠르게.
        headline_emphasis: 여기서 정확하게.
        cta_label: 라이브 강의 둘러보기
        cta_url: https://bizschool.naver.com/
    bottom:
      headline_line1: 네이버 비즈니스 성장을 위한 특별한 교육.
      headline_emphasis: 네이버를 가장 잘 아는 사람들
      headline_line2: 에게서.
      body_html: 네이버 비즈니스의 성장 공식을 매번 분석할 필요 없이. 서비스를 직접 운영 & 설계한 <span class="highlight">네이버 프로의 강의</span>를 통해 꼭 필요한 솔루션만 찾을 수 있습니다.
  - type: pros
    eyebrow: 네이버 프로
    divider_after: true
    cards:
      - quote: 네이버에서 성공하려면 네이버를 알아야 해요. 만들어본 사람에게 배우는 게 가장 빠른 방법이에요.
        color: orange
        meta: 컨텐츠 | 권세영 프로
      - quote: 든든한 페이스메이커, 비즈니스 러닝메이트가 되겠습니다.
        color: teal
        meta: 스마트플레이스 | 한갑산 프로
      - quote: 무조건 광고비 많이 태우라고 말하는 강의는 가짜입니다.
        color: blue
        meta: 광고 | 이혜련 프로
    qna_title_line1: 자주 묻는 질문,
    qna_title_line2: 네이버 프로가 직접 답하는
    qna_title_emphasis: 진심
    qna_items:
      - q: 네비스 강의는 어떤 사람에게 적합한가요?
        a: 온라인 판매자, 광고 초보자, 오프라인 매장 운영자 등 네이버 비즈니스 생태계를 활용해 성장하고 싶은 모든 분들에게 적합합니다.
        open_by_default: true
      - q: 강의를 놓쳐도 다시 볼 수 있나요?
        a: 거의 모든 온라인 강의는 다시보기 제공으로 언제든 복습할 수 있습니다. 라이브 강의 역시 녹화본을 통해 학습이 가능합니다.
        open_by_default: false
      - q: 교육 비용은 어떻게 되나요?
        a: 강의마다 비용이 다르지만, 무료 강의와 유료 강의가 모두 제공됩니다. 네이버 비즈니스 스쿨에서 수강 가능한 프로그램을 확인해 보세요.
        open_by_default: false
      - q: 오프라인 스퀘어를 방문하려면 어떻게 하나요?
        a: 지역별 네이버 스퀘어 위치를 확인하고 예약 후 방문하시면 됩니다. 온라인과 오프라인을 함께 활용하는 학습이 가능합니다.
        open_by_default: false
  - type: square
    eyebrow: 네이버 스퀘어
    title_line1: 나의 비즈니스 고민 해결,
    title_emphasis: 전국구 네이버 스퀘어
    divider_after: false
    title_line2: 실전 경험은
    title_line2_suffix: 에서
    rows:
      - row_style: map
        image: /images/korea-map.png
        image_alt: 네이버 스퀘어 전국 지도 (역삼·종로·부산·광주)
        headline_line1: 지역이 달라도 동일한 성장 기회.
        headline_line2: 전국의 사업자들이 모여드는
        headline_emphasis: 지역 거점 성장 허브
        location_tabs:
          - label: 역삼
            id: yeoksam
            active: false
          - label: 종로
            id: jongno
            active: true
          - label: 부산
            id: busan
            active: false
          - label: 광주
            id: gwangju
            active: false
        link_label: ''
        link_url: ''
      - row_style: studio
        image: /images/studio.png
        image_alt: 네이버 스퀘어 스튜디오
        headline_line1: 온라인에서 배운 걸
        headline_line2: 직접 써볼 수 있는
        headline_emphasis: 성장 실습 허브
        link_label: 네이버 스퀘어 예약하러 가기 →
        link_url: https://bizschool.naver.com/
